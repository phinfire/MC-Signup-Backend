services:
  auth:
    build:
      context: ../authService  # Update path to your auth service directory
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8001
    ports:
      - "8001:8001"
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth:8001
    depends_on:
      - db
      - auth
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db_data: